name: CI
on:
    pull_request:

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version-file: .nvmrc
                cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
            - run: npm run test:e2e
            - run: npx lhci autorun
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                name: reports
                path: |
                  playwright-report
                  .lighthouseci
                  